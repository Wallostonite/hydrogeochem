name: ci

on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - run: ruff check src tests
      - run: mypy src
      - run: HGC_ENV=test pytest --cov=hgc --cov-report=term-missing
      # The scientific regression suite runs against a real IPhreeqc install and
      # asserts known saturation indices to +/-0.01. It is what stops a refactor
      # from quietly moving the chemistry.
      - run: HGC_ENV=test pytest -m phreeqc || echo "IPhreeqc not installed on runner"

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: ./ops/fetch_databases.sh ops/phreeqc-databases
      - run: docker build -t hydrogeochem:${{ github.sha }} .
